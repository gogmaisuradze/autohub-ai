    <title>CarMe - All-in-One ჭკვიანი ავტო-პლატფორმა & AI დიაგნოსტიკა | carme.ge</title>
    
    <script>
      // 1. Force instant dynamic circular favicon in browser tab (bypasses browser favicon cache)
      (function() {
        try {
          var circleUrl = '/carme-circle-badge.png?v=' + Date.now();
          var existing = document.querySelectorAll("link[rel*='icon']");
          existing.forEach(function(el) { el.parentNode.removeChild(el); });
          var link = document.createElement('link');
          link.type = 'image/png';
          link.rel = 'shortcut icon';
          link.href = circleUrl;
          document.head.appendChild(link);
          var icon32 = document.createElement('link');
          icon32.type = 'image/png';
          icon32.sizes = '32x32';
          icon32.rel = 'icon';
          icon32.href = circleUrl;
          document.head.appendChild(icon32);
        } catch (e) {}
      })();

      // 2. Service Worker: მხოლოდ ვებ-ვერსიაზე. ნატიურ აპში (Capacitor) SW ქეშავდა
      //    ძველ კოდს → განახლებები არ ჩანდა; ამიტომ ვშლით SW-ს და ქეშს.
      (function() {
        var isNative = location.protocol === 'capacitor:' || location.protocol === 'ionic:' || location.hostname === 'localhost';
        if (isNative) {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              regs.forEach(function(r) { r.unregister(); });
            }).catch(function() {});
          }
          if (window.caches && caches.keys) {
            caches.keys().then(function(keys) { keys.forEach(function(k) { caches.delete(k); }); }).catch(function() {});
          }
        } else if ('serviceWorker' in navigator) {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js').then(function(reg) { reg.update(); }).catch(function() {});
          });
        }
      })();
    </script>
